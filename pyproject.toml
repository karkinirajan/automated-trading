[project]
name = "automated-trading"
version = "0.1.0"
description = "Multi-AI autonomous trading arena for NASDAQ 100 stocks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "langchain",
    "langchain-openai",
    "langchain-mcp-adapters",
    "langgraph",
    "fastmcp",
    "python-dotenv",
    "requests",
    "numpy",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# An application, not a library: it is run from the repository root (`make run`), not installed.
package = false

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = ["tests/mutation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# These modules put the project root on sys.path before importing `tools.*`, so they can be run directly from a subfolder.
"agent/**" = ["E402"]
"agent_tools/**" = ["E402"]
"prompts/**" = ["E402"]
"main.py" = ["E402"]
"main_parrallel.py" = ["E402"]
"data/**" = ["E402"]
"tools/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
